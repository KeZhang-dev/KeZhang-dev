<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <defs>
    <linearGradient id="kAccent" gradientUnits="userSpaceOnUse" x1="140" y1="52" x2="495" y2="414">
      <stop offset="0%" stop-color="#8C7CFF"/>
      <stop offset="100%" stop-color="#3FD8E0"/>
    </linearGradient>
    <radialGradient id="kGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C6FF0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C6FF0" stop-opacity="0"/>
    </radialGradient>
    <filter id="kBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="kGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="kClip">
      <rect x="1" y="1" width="598" height="478" rx="22"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="598" height="478" rx="22" fill="#101018" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="1" y="1" width="598" height="478" fill="url(#kGrid)" clip-path="url(#kClip)"/>

  <text x="30" y="42" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#7C7C8A">KONER &#8212; SYSTEM ARCHITECTURE</text>
  <line x1="30" y1="52" x2="140" y2="52" stroke="url(#kAccent)" stroke-width="2"/>

  <!-- connectors -->
  <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.3" fill="none">
    <line x1="300" y1="106" x2="300" y2="166"/>
    <line x1="300" y1="226" x2="200" y2="290"/>
    <line x1="300" y1="226" x2="430" y2="290"/>
    <line x1="430" y1="326" x2="430" y2="374"/>
  </g>
  <g stroke="url(#kAccent)" stroke-width="1.4" stroke-dasharray="4 6" fill="none" opacity="0.85">
    <line x1="300" y1="226" x2="300" y2="290"/>
  </g>
  <g stroke="url(#kAccent)" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.9">
    <line x1="300" y1="106" x2="300" y2="166">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="430" y1="326" x2="430" y2="374">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- USER -->
  <rect x="245" y="70" width="110" height="36" rx="10" fill="#161620" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="300" y="93" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#C6C6D2">USER</text>

  <!-- AGENT (glow) -->
  <ellipse cx="300" cy="196" rx="110" ry="70" fill="url(#kGlow)" filter="url(#kBlur)"/>
  <rect x="225" y="166" width="150" height="60" rx="14" fill="#14141E" stroke="url(#kAccent)" stroke-width="1.8"/>
  <text x="300" y="192" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#F2F2F5">AGENT</text>
  <text x="300" y="209" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="0.5" fill="#8C86EE">LLM TOOL-CALLING LOOP</text>

  <!-- TOOLS / MEMORY / DATA -->
  <rect x="145" y="290" width="110" height="36" rx="10" fill="#161620" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="200" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#C6C6D2">TOOLS</text>

  <rect x="245" y="290" width="110" height="36" rx="10" fill="#161620" stroke="#3FD8E0" stroke-opacity="0.35"/>
  <text x="300" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#C6C6D2">MEMORY</text>

  <rect x="375" y="290" width="110" height="36" rx="10" fill="#161620" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <text x="430" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#C6C6D2">DATA</text>

  <!-- POSTGRESQL -->
  <rect x="365" y="374" width="130" height="40" rx="10" fill="#12121C" stroke="#FFFFFF" stroke-opacity="0.16"/>
  <text x="430" y="399" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" letter-spacing="0.5" fill="#A6A6B3">POSTGRESQL</text>

  <text x="570" y="458" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#5A5A68">FIG. 01</text>
</svg>
