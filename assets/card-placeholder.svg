<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 560 300" width="560" height="300" role="img" aria-label="More Work">
  <defs>
    <linearGradient id="cb-border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="560" y2="300">
      <stop offset="0%" stop-color="#ff00d9"/>
      <stop offset="100%" stop-color="#00ffe7"/>
    </linearGradient>
    <linearGradient id="cb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0326"/>
      <stop offset="1" stop-color="#08001f"/>
    </linearGradient>
    <pattern id="cb-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ff00d9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="cb-clip"><rect x="1" y="1" width="558" height="298" rx="16"/></clipPath>
    <filter id="cb-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="558" height="298" rx="16" fill="url(#cb-sky)" stroke="url(#cb-border)" stroke-width="1.6"/>
  <rect x="1" y="1" width="558" height="298" fill="url(#cb-grid)" clip-path="url(#cb-clip)"/>
  <text x="24" y="34" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" letter-spacing="2" fill="#ff00d9" opacity="0.85">[ 04 ]</text>
  <text x="24" y="64" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#fff8e7">More Work</text>
  <text x="24" y="92" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#b9b6c9">More projects are currently in active development.</text>
  <text x="24" y="111" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#b9b6c9">Check back soon, or explore what's shipped above.</text>
  <rect x="24.5" y="232.5" width="189" height="39" rx="8" fill="none" stroke="#5a5170" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="119.0" y="256" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="10.5" letter-spacing="1" fill="#8f8aa3">// IN_PROGRESS</text>
</svg>
