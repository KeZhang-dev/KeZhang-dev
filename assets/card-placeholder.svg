<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 414" width="640" height="414" role="img" aria-label="More Work">
  <defs>
    <linearGradient id="cb-border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="414">
      <stop offset="0%" stop-color="#ff00d9"/>
      <stop offset="100%" stop-color="#00ffe7"/>
    </linearGradient>
    <linearGradient id="cb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0326"/>
      <stop offset="1" stop-color="#08001f"/>
    </linearGradient>
    <pattern id="cb-grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#ff00d9" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="cb-clip"><rect x="1" y="1" width="638" height="412" rx="16"/></clipPath>
    <filter id="cb-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="638" height="412" rx="16" fill="url(#cb-sky)" stroke="url(#cb-border)" stroke-width="1.6"/>
  <rect x="1" y="1" width="638" height="412" fill="url(#cb-grid)" clip-path="url(#cb-clip)"/>
  <text x="28" y="38" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" letter-spacing="2" fill="#ff00d9" opacity="0.85">[ 04 ]</text>
  <text x="28" y="80" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="29" font-weight="700" fill="#fff8e7">More Work</text>
  <text x="28" y="110" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#c7c4d6">More projects are currently in active</text>
  <text x="28" y="139" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#c7c4d6">development. Check back soon, or explore</text>
  <text x="28" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#c7c4d6">what's shipped above.</text>
  <rect x="28.5" y="346.5" width="209" height="43" rx="9" fill="none" stroke="#5a5170" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="133.0" y="373" text-anchor="middle" font-family="'JetBrains Mono',Consolas,monospace" font-size="12" letter-spacing="1" fill="#8f8aa3">// IN_PROGRESS</text>
</svg>
