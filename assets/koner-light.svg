<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <defs>
    <linearGradient id="kAccentL" gradientUnits="userSpaceOnUse" x1="140" y1="52" x2="495" y2="414">
      <stop offset="0%" stop-color="#6355D6"/>
      <stop offset="100%" stop-color="#0E9AA8"/>
    </linearGradient>
    <radialGradient id="kGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6355D6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6355D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="kBlurL" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="kGridL" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#000000" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="kClipL">
      <rect x="1" y="1" width="598" height="478" rx="22"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="598" height="478" rx="22" fill="#FFFFFF" stroke="#000000" stroke-opacity="0.09"/>
  <rect x="1" y="1" width="598" height="478" fill="url(#kGridL)" clip-path="url(#kClipL)"/>

  <text x="30" y="42" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="11" letter-spacing="2" fill="#75757F">KONER &#8212; SYSTEM ARCHITECTURE</text>
  <line x1="30" y1="52" x2="140" y2="52" stroke="url(#kAccentL)" stroke-width="2"/>

  <!-- connectors -->
  <g stroke="#000000" stroke-opacity="0.22" stroke-width="1.3" fill="none">
    <line x1="300" y1="106" x2="300" y2="166"/>
    <line x1="300" y1="226" x2="200" y2="290"/>
    <line x1="300" y1="226" x2="430" y2="290"/>
    <line x1="430" y1="326" x2="430" y2="374"/>
  </g>
  <g stroke="url(#kAccentL)" stroke-width="1.4" stroke-dasharray="4 6" fill="none" opacity="0.85">
    <line x1="300" y1="226" x2="300" y2="290"/>
  </g>
  <g stroke="url(#kAccentL)" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.9">
    <line x1="300" y1="106" x2="300" y2="166">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="430" y1="326" x2="430" y2="374">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- USER -->
  <rect x="245" y="70" width="110" height="36" rx="10" fill="#F4F4F7" stroke="#000000" stroke-opacity="0.12"/>
  <text x="300" y="93" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#3A3A46">USER</text>

  <!-- AGENT (glow) -->
  <ellipse cx="300" cy="196" rx="110" ry="70" fill="url(#kGlowL)" filter="url(#kBlurL)"/>
  <rect x="225" y="166" width="150" height="60" rx="14" fill="#FFFFFF" stroke="url(#kAccentL)" stroke-width="1.8"/>
  <text x="300" y="192" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14141C">AGENT</text>
  <text x="300" y="209" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="9" letter-spacing="0.5" fill="#6355D6">LLM TOOL-CALLING LOOP</text>

  <!-- TOOLS / MEMORY / DATA -->
  <rect x="145" y="290" width="110" height="36" rx="10" fill="#F4F4F7" stroke="#000000" stroke-opacity="0.12"/>
  <text x="200" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#3A3A46">TOOLS</text>

  <rect x="245" y="290" width="110" height="36" rx="10" fill="#F4F4F7" stroke="#0E9AA8" stroke-opacity="0.45"/>
  <text x="300" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#3A3A46">MEMORY</text>

  <rect x="375" y="290" width="110" height="36" rx="10" fill="#F4F4F7" stroke="#000000" stroke-opacity="0.12"/>
  <text x="430" y="313" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="1" fill="#3A3A46">DATA</text>

  <!-- POSTGRESQL -->
  <rect x="365" y="374" width="130" height="40" rx="10" fill="#F7F7FA" stroke="#000000" stroke-opacity="0.14"/>
  <text x="430" y="399" text-anchor="middle" font-family="SFMono-Regular,Consolas,monospace" font-size="11.5" letter-spacing="0.5" fill="#54545E">POSTGRESQL</text>

  <text x="570" y="458" text-anchor="end" font-family="SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#9A9AA4">FIG. 01</text>
</svg>
