<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email · Ke Zhang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0018; --panel: #12002c; --pink: #ff00d9; --cyan: #00ffe7; --text: #fff8e7; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', Consolas, monospace;
  }
  .box {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center;
    padding: 24px 28px; border-radius: 20px; background: var(--panel);
    border: 2px solid transparent;
    background: linear-gradient(var(--panel), var(--panel)) padding-box,
                linear-gradient(120deg, var(--pink), var(--cyan)) border-box;
    box-shadow: 0 0 24px rgba(255, 0, 217, .25), 0 0 24px rgba(0, 255, 231, .2);
  }
  .email { font-size: clamp(20px, 5vw, 40px); font-weight: 700; letter-spacing: .02em; word-break: break-all; user-select: all; }
  button {
    font: inherit; font-size: clamp(14px, 2.4vw, 18px); font-weight: 700; letter-spacing: .1em;
    padding: 12px 22px; border-radius: 999px; cursor: pointer;
    color: var(--bg); background: var(--cyan); border: none;
    box-shadow: 0 0 14px rgba(0, 255, 231, .6); transition: transform .1s, background .2s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: scale(.97); }
  button.done { background: var(--pink); box-shadow: 0 0 14px rgba(255, 0, 217, .6); color: var(--text); }
</style>
</head>
<body>
  <div class="box">
    <span class="email" id="email">kzhangdevnz@gmail.com</span>
    <button id="copy" type="button">COPY</button>
  </div>
<script>
  const btn = document.getElementById('copy');
  const email = document.getElementById('email').textContent;
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(email);
    } catch {
      const r = document.createRange();
      r.selectNodeContents(document.getElementById('email'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      document.execCommand('copy');
    }
    btn.textContent = 'COPIED ✓';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('done'); }, 1800);
  });
</script>
</body>
</html>
